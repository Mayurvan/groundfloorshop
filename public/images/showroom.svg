<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="showroom-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c39bd3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#showroom-bg)"/>
  
  <!-- Spotlights -->
  <circle cx="100" cy="20" r="8" fill="#ffd700" opacity="0.9"/>
  <circle cx="200" cy="20" r="8" fill="#ffd700" opacity="0.9"/>
  <circle cx="300" cy="20" r="8" fill="#ffd700" opacity="0.9"/>
  
  <!-- Display pedestals -->
  <rect x="60" y="100" width="60" height="80" fill="#e8d4f1" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="90" cy="95" r="20" fill="#d4af37" opacity="0.8"/>
  
  <rect x="170" y="80" width="60" height="100" fill="#e8d4f1" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="200" cy="70" r="22" fill="#d4af37" opacity="0.8"/>
  
  <rect x="280" y="100" width="60" height="80" fill="#e8d4f1" stroke="#9b59b6" stroke-width="2"/>
  <circle cx="310" cy="95" r="20" fill="#d4af37" opacity="0.8"/>
  
  <!-- Glass panels -->
  <line x1="50" y1="190" x2="350" y2="190" stroke="#b3b3b3" stroke-width="3" opacity="0.6"/>
  
  <!-- Sign -->
  <rect x="100" y="220" width="200" height="40" fill="#8b008b" stroke="#2c3e50" stroke-width="2" rx="6"/>
  <text x="200" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="white">LUXURY</text>
</svg>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="retail-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5deb3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d2b48c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#retail-bg)"/>
  
  <!-- Building facade -->
  <rect x="50" y="40" width="300" height="220" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  
  <!-- Store windows -->
  <rect x="70" y="60" width="70" height="120" fill="#3498db" opacity="0.7" stroke="#2c3e50" stroke-width="2"/>
  <rect x="165" y="60" width="70" height="120" fill="#3498db" opacity="0.7" stroke="#2c3e50" stroke-width="2"/>
  <rect x="260" y="60" width="70" height="120" fill="#3498db" opacity="0.7" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Window panes -->
  <line x1="105" y1="60" x2="105" y2="180" stroke="#2c3e50" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="180" stroke="#2c3e50" stroke-width="1"/>
  <line x1="295" y1="60" x2="295" y2="180" stroke="#2c3e50" stroke-width="1"/>
  
  <!-- Door -->
  <rect x="165" y="190" width="70" height="70" fill="#8b4513" stroke="#2c3e50" stroke-width="2"/>
  <circle cx="230" cy="225" r="4" fill="#d4af37"/>
  
  <!-- Shop sign -->
  <rect x="120" y="200" width="160" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" rx="4"/>
  <text x="200" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="white">SHOP</text>
</svg>